<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Главные инструменты помощи — Крепком</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="metrics.js" defer></script>
</head>
<body>

<div class="container">

    <header class="header">
        <div class="logo-box">
            <a href="https://krepcom.ru" target="_blank">
                <img src="logo-new-krepcom_WATERMARK.png" alt="Крепком">
            </a>
        </div>
    </header>

    <main class="catalog-card">
        <h1 class="catalog-title">Инструменты подбора крепежа</h1>
        <p class="catalog-subtitle">Выберите вариант из списка</p>

        <!-- Навигация (список) -->
        <nav class="anchor-nav">
            <ul>
                <li><a href="https://justaddresssss-hue.github.io/infoland_table/" target="_blank">Таблица подбора
                     сверла под метчик</a></li>
                <li><a href="https://justaddresssss-hue.github.io/compatibility/" target="_blank">Таблица совместимости металлов</a></li>
                <li><a href="https://justaddresssss-hue.github.io/-calc_torq/" target="_blank">
Калькулятор крутящего момента и прочности

                </a></li>
                
            </ul>
        </nav>

    </main>
    <footer class="footer">
        <p>Нажмите на нужный раздел и решайте ваши задачи.</p>
    </footer>

</div>

<!-- Кнопка "Наверх" -->
<button class="scroll-top-btn" id="scrollTopBtn" title="Наверх">
    <i class="fas fa-chevron-up"></i>
</button>

<script>
    // Плавная прокрутка к якорям
    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
        anchor.addEventListener('click', function (e) {
            e.preventDefault();
            const target = document.querySelector(this.getAttribute('href'));
            if (target) {
                target.scrollIntoView({
                    behavior: 'smooth',
                    block: 'start'
                });
            }
        });
    });

    // Кнопка "Наверх"
    const scrollTopBtn = document.getElementById('scrollTopBtn');
    
    window.addEventListener('scroll', () => {
        if (window.pageYOffset > 300) {
            scrollTopBtn.classList.add('visible');
        } else {
            scrollTopBtn.classList.remove('visible');
        }
    });

    scrollTopBtn.addEventListener('click', () => {
        window.scrollTo({
            top: 0,
            behavior: 'smooth'
        });
    });
</script>

</body>
</html>
